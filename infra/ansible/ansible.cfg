[defaults]
inventory = inventories/dev/hosts.yml
roles_path = roles
collections_path = ~/.ansible/collections
interpreter_python = auto_silent
# Host key checking stays ENABLED (default). Trust a new host explicitly:
#   ssh-keyscan -H <ip> >> ~/.ssh/known_hosts      (verify the fingerprint out of band)
# Only for throw-away labs: export ANSIBLE_HOST_KEY_CHECKING=False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
# Optional: vault password file kept OUTSIDE the repo
# vault_password_file = ~/.config/resume-review/vault-pass

[ssh_connection]
pipelining = True
