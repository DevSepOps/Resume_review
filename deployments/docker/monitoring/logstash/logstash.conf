# Pipeline: Beats (metricbeat) -> Elasticsearch.
# ${ELASTIC_PASSWORD} is resolved from the container environment (never hardcode it).
input {
  beats {
    port => 5044
  }
}

filter {
  if [@metadata][beat] == "metricbeat" {
    mutate { add_field => { "[@metadata][target_index]" => "metricbeat-%{+YYYY.MM.dd}" } }
  } else {
    # Default index for any other event so output never receives an unresolved %{...}.
    mutate { add_field => { "[@metadata][target_index]" => "logstash-%{+YYYY.MM.dd}" } }
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    index    => "%{[@metadata][target_index]}"
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"
  }
}
