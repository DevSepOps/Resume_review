# Traefik v3 STATIC configuration (Docker Swarm deployment).
# Same as deployments/docker/proxy/traefik.yml except the provider is `swarm`
# (reads labels from `deploy.labels`) and the overlay network name differs.
# __ACME_EMAIL__ / __ACME_CA_SERVER__ are rendered by the service entrypoint (see docker-stack.yml).
global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false

ping:
  entryPoint: ping

log:
  level: INFO
  format: json

accessLog:
  format: json
  bufferingSize: 100
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep

entryPoints:
  ping:
    address: "127.0.0.1:8082"
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: le
      middlewares:
        - secure-headers@file
        - compress@file

providers:
  swarm:
    endpoint: "tcp://docker-socket-proxy:2375"
    exposedByDefault: false
    network: resume_public
    watch: true
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  le:
    acme:
      email: "__ACME_EMAIL__"
      storage: /letsencrypt/acme.json
      caServer: "__ACME_CA_SERVER__"
      httpChallenge:
        entryPoint: web
