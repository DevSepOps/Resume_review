{{- include "rr.validate" . -}}
{{- if .Values.secrets.create }}
{{- $v := .Values.secrets.values }}
{{- $jwt := required "secrets.values.JWT_SECRET_KEY is required (>= 32 chars)" $v.JWT_SECRET_KEY }}
{{- if lt (len $jwt) 32 }}{{ fail "secrets.values.JWT_SECRET_KEY must be at least 32 characters" }}{{ end }}
{{- $flet := required "secrets.values.FLET_SECRET_KEY is required" $v.FLET_SECRET_KEY }}
{{- $dburl := "" }}
{{- if .Values.db.enabled }}
{{- $u := required "secrets.values.POSTGRES_USER is required" $v.POSTGRES_USER }}
{{- $p := required "secrets.values.POSTGRES_PASSWORD is required" $v.POSTGRES_PASSWORD }}
{{- $d := required "secrets.values.POSTGRES_DB is required" $v.POSTGRES_DB }}
{{- $dburl = printf "postgresql+psycopg2://%s:%s@%s:5432/%s" (urlquery $u) (urlquery $p) (include "rr.dbName" .) (urlquery $d) }}
{{- else }}
{{- $dburl = required "externalDatabase.url is required when db.enabled=false" .Values.externalDatabase.url }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rr.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ $jwt | quote }}
  FLET_SECRET_KEY: {{ $flet | quote }}
  DATABASE_URL: {{ $dburl | quote }}
  {{- if .Values.db.enabled }}
  POSTGRES_USER: {{ $v.POSTGRES_USER | quote }}
  POSTGRES_PASSWORD: {{ $v.POSTGRES_PASSWORD | quote }}
  POSTGRES_DB: {{ $v.POSTGRES_DB | quote }}
  {{- end }}
{{- end }}
