{{- if and .Values.networkPolicy.enabled .Values.db.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rr.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rr.selectorLabels" (dict "ctx" . "component" "db") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rr.selectorLabels" (dict "ctx" . "component" "backend") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "rr.selectorLabels" (dict "ctx" . "component" "migrations") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 5432}
{{- end }}
