apiVersion: v1
kind: Pod
metadata:
  name: {{ include "rr.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rr.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: curl
      image: {{ .Values.test.image.repository }}:{{ .Values.test.image.tag }}
      command: ["curl", "--fail", "--silent", "--show-error", "--max-time", "10", "http://{{ include "rr.backendName" . }}:{{ .Values.backend.port }}/ready"]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        limits: {memory: 64Mi}
