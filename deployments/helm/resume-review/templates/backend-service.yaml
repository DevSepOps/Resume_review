apiVersion: v1
kind: Service
metadata:
  name: {{ include "rr.backendName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rr.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
  selector:
    {{- include "rr.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
