name: Infra CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TERRAFORM_VERSION: '1.9.8'

jobs:
  terraform:
    name: Terraform (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        env: [dev, dev-azure]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive infra/terraform

      # No backend, no credentials: validation is purely static.
      - name: init
        run: terraform -chdir=infra/terraform/envs/${{ matrix.env }} init -backend=false -input=false

      - name: validate
        run: terraform -chdir=infra/terraform/envs/${{ matrix.env }} validate

  ansible:
    name: Ansible lint and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint
          ansible-galaxy collection install -r requirements.yml

      - name: Syntax check
        run: |
          ansible-playbook playbooks/site.yml --syntax-check
          ansible-playbook playbooks/deploy.yml --syntax-check

      - name: ansible-lint
        run: ansible-lint
