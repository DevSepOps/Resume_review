name: Deploy

# Deploys an already-built image tag to the production host over SSH (key auth only).
# Runs on a version tag push or manually. The `production` environment must have
# required reviewers configured so every deploy needs approval.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git tag or sha-<7> image tag to deploy (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE: docker.io/sepehrmdn/resume-review-backend
  FRONTEND_IMAGE: docker.io/sepehrmdn/resume-review-frontend

jobs:
  wait-for-images:
    name: Wait for images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Resolve and validate ref
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
          GITHUB_REF_NAME_: ${{ github.ref_name }}
        run: |
          ref="${INPUT_REF:-$GITHUB_REF_NAME_}"
          # Strict allow-list: it is interpolated into a remote shell command later.
          if ! [[ "$ref" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?|sha-[0-9a-f]{7})$ ]]; then
            echo "::error::ref '$ref' must look like vX.Y.Z or sha-<7 hex>"; exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Tag pushes also trigger the image builds; wait until both manifests exist.
      - name: Wait until both images are published
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            for i in $(seq 1 60); do
              if docker buildx imagetools inspect "$image:$REF" >/dev/null 2>&1; then
                echo "found $image:$REF"; continue 2
              fi
              echo "waiting for $image:$REF ($i/60)"; sleep 20
            done
            echo "::error::$image:$REF not found"; exit 1
          done

  deploy:
    name: Deploy to production
    needs: wait-for-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REF: ${{ needs.wait-for-images.outputs.ref }}
        run: |
          # REF is validated against a strict regex in the previous job.
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes -o PasswordAuthentication=no \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$REF" <<'REMOTE'
          set -euo pipefail
          ref="$1"
          cd /opt/resume-review
          git fetch --tags --prune origin
          case "$ref" in
            v*) git checkout --detach "refs/tags/$ref" ;;   # compose files at the released version
            *)  git checkout --detach origin/main ;;       # sha-<7>: images pinned via TAG below
          esac
          cd deployments/docker
          # Pin the images to the deployed tag (shell env overrides the TAG in .env).
          export TAG="$ref"
          docker compose --env-file .env pull
          docker compose --env-file .env up -d --remove-orphans --wait
          docker compose --env-file .env ps
          REMOTE

      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
