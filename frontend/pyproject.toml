[project]
name = "resume-review-frontend"
version = "1.0.0"
description = "Flet web frontend for the Resume Review platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Resume Review team" }]
dependencies = [
  "flet==0.28.3",
  "flet-web==0.28.3",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["src/main.py"]

[tool.coverage.report]
show_missing = true
